version: '3.8'

# Configuration générée automatiquement par Antigravity Software Factory
# Projet isolé : tictactoe sur https://tictactoe.hyndruide.fr

services:
  tictactoe-server:
    build:
      context: ./
      dockerfile: Dockerfile
    container_name: tictactoe-relay
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 80M
    networks:
      - app-net
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.tictactoe.rule=Host(`tictactoe.hyndruide.fr`)"
      - "traefik.http.routers.tictactoe.entrypoints=websecure"
      - "traefik.http.routers.tictactoe.tls=true"
      - "traefik.http.routers.tictactoe.tls.certresolver=myresolver"
      - "traefik.http.middlewares.tictactoe-ratelimit.ratelimit.average=30"
      - "traefik.http.middlewares.tictactoe-ratelimit.ratelimit.burst=50"
      - "traefik.http.middlewares.tictactoe-headers.headers.sslredirect=true"
      - "traefik.http.middlewares.tictactoe-headers.headers.contentTypeNosniff=true"
      - "traefik.http.routers.tictactoe.middlewares=tictactoe-ratelimit,tictactoe-headers"
      - "traefik.http.services.tictactoe.loadbalancer.server.port=8011"

networks:
  app-net:
    external: true
    name: trame-interieure_app-net

